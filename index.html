<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101110" />
    <meta name="description" content="SmartOperation: оценки, финансы, расписание, заметки и котировки в одном приложении." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SmartOperation" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>SmartOperation</title>
    <script>
      // Apply the saved theme before the first paint (see src/app/theme.ts).
      try {
        document.documentElement.dataset.theme = localStorage.getItem('tracker.theme') || 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
